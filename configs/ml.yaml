# ML settings: data source, windowing, thresholds and weights. Values are filled from the project spec.
ingest:
  short_name: HLSL30
  version: "2.0"
  # Arizona, Pinal/Maricopa area. Approximate: verify against the CDL map before a real run.
  bbox: [-111.9, 32.9, -111.5, 33.2]
  temporal: ["2021-04-01", "2021-10-31"]
  count: 100
  # Selected scenes, one per date (CMR cloud-cover pre-filter applied).
  dates: ["2021-04-21", "2021-05-16", "2021-06-01", "2021-06-24", "2021-07-26", "2021-08-27", "2021-09-21", "2021-10-14"]
  max_download_mb: 1500
  local_path: D:/carver-data/hls
features: {}
thresholds:
  max_cloud_pct: 20      # облачность внутри bbox по Fmask
  bare_soil_ndvi: 0.2    # NDVI ниже этого считаем голой почвой
weights: {}
baseline:
  # bbox A: this clip is not on the PC (D:/carver-data/cdl has only bboxB/). Recreate it with
  # python -m fs_ml.cdl clip after adding cdl_source here; until then the bbox A baseline does not run.
  cdl_path: D:/carver-data/cdl/az_2021_cdl.tif
  hls_dir: D:/carver-data/hls
  output_dir: D:/carver-data/baseline
  reports_dir: reports
  nir_band: B05
  red_band: B04
  fmask_band: Fmask
  # HLS v2.0 Fmask bits (LP DAAC User Guide, Table 9): 1 cloud, 2 adjacent to cloud/shadow, 3 cloud shadow.
  cloud_bits: [1, 2, 3]
  # A date is dropped whole if fewer than this share of in-bbox pixels are clear (Fmask bits 1-3 unset,
  # B04 and B05 > 0). Remaining per-pixel gaps stay NaN (RandomForest handles NaN); nothing is filled.
  min_date_clear_share: 0.5
  # A pixel enters training and metrics if clear kept dates >= ceil(min_clear_fraction * n_kept_dates).
  min_clear_fraction: 0.5
  spatial_blocks: 3
  buffer_px: 30          # ~900 m at 30 m resolution
  max_train_per_class: 10000
  random_state: 42
  random_forest:
    n_estimators: 100
    n_jobs: 1
    class_weight: balanced
export:
  schema_path: contracts/schema.json
  sample_path: examples/sample_output.json
