# CDL class groups for the baseline. Codes not listed here fall into `other_group`.
# Code names (USDA CDL legend, for reference only): 1 corn, 2 cotton, 21 barley, 22 durum wheat,
# 36 alfalfa, 61 fallow/idle cropland, 0 no data (excluded from training and evaluation).
other_group: other
groups:
  alfalfa: [36]
  cotton: [2]
  small_grains: [21, 22]
  corn: [1]
  fallow_idle: [61]
agricultural_groups: [alfalfa, cotton, small_grains, corn, fallow_idle]
# Export only (pixel summary parquet). Per-class F1 in reports stays on the original groups.
export_merge:
  other_crop: [small_grains, corn]
# Export flag: pixels predicted as these groups get low_confidence=true. Empty since history (2026-11-14):
# fallow_idle bbox precision 0.865 (was 0.695, flagged then).
low_confidence_groups: []
# features: history. CDL codes counted as cultivated (crops incl. alfalfa/hay, orchards, double crops, fallow 61):
# 1-61, 66-77, 204-254. Everything else (pasture 62, forest, shrubland 152, grassland 176, developed 121-124,
# barren 131, water 111, wetlands) is 0; code 0 (no data) is missing.
cultivated_codes: [[1, 61], [66, 77], [204, 254]]
# Furrow crop keys (pipeline/crops.py, see docs/furrow_compat.md). Groups without a key here are not exported:
# alfalfa and corn have no Furrow key; small_grains mixes barley (Furrow `barley`) and durum (`durum`).
furrow_keys:
  cotton: cotton
  fallow_idle: fallow
