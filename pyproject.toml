[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fs_ml"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "earthaccess>=0.19",
    "h3>=4.1",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rasterio>=1.4",
    "rioxarray>=0.17",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "types-PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
files = ["src/fs_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/fs_ml/baseline.py" = ["E402"]
"src/fs_ml/sweep.py" = ["E402"]
"src/fs_ml/experiments.py" = ["E402"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "sklearn.*", "matplotlib.*", "pyarrow.*", "pandas.*", "earthaccess.*", "rioxarray.*", "h3.*"]
ignore_missing_imports = true
